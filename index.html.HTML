<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema JK</title>

    <!-- Tipografías e iconos (solo para el menú añadido) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #071316;
            font-family: Arial, Helvetica, sans-serif;
        }

        #appFrame {
            display: block;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: 0;
            margin: 0;
            padding: 0;

            background: #071316;
        }
    </style>

    <!-- ============================================================
         ESTILOS EXCLUSIVOS DEL MENÚ DE NAVEGACIÓN OCULTO (JK NAV)
         No afectan al iframe ni a la app cargada.
    ============================================================= -->
    <style id="jkNavStyles">
        :root{
            --jk-accent:#2CCEBF;
            --jk-accent-soft:rgba(44,206,191,.16);
            --jk-accent-line:rgba(44,206,191,.28);
            --jk-deep:#071316;
            --jk-panel:#0a1c20;
            --jk-text:#e9f8f6;
            --jk-muted:#7b9c99;
            --jk-nav-w:272px;
            --jk-ease:cubic-bezier(.16,1,.3,1);
        }

        /* ---------- Velo ---------- */
        #jkScrim{
            position:fixed;
            inset:0;
            z-index:9990;
            background:rgba(3,10,12,.62);
            -webkit-backdrop-filter:blur(3px);
            backdrop-filter:blur(3px);
            opacity:0;
            visibility:hidden;
            transition:opacity .4s var(--jk-ease), visibility .4s;
        }
        body.jk-nav-open #jkScrim{opacity:1;visibility:visible;}

        /* ---------- Pestaña oculta (disparador) ---------- */
        #jkHandle{
            position:fixed;
            left:0;
            top:50%;
            transform:translateY(-50%);
            z-index:9995;
            width:32px;
            height:136px;
            padding:0;
            border:0;
            border-radius:0 16px 16px 0;
            cursor:pointer;
            color:var(--jk-accent);
            background:
                linear-gradient(180deg, rgba(44,206,191,.10), rgba(44,206,191,.02)),
                linear-gradient(180deg,#0c2429,#071316);
            border-right:1px solid var(--jk-accent-line);
            border-top:1px solid var(--jk-accent-line);
            border-bottom:1px solid var(--jk-accent-line);
            box-shadow:6px 0 22px -8px rgba(0,0,0,.9), inset -1px 0 0 rgba(44,206,191,.12);
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:12px;
            opacity:.5;
            transition:width .35s var(--jk-ease), opacity .3s ease, transform .35s var(--jk-ease), box-shadow .35s ease;
        }
        #jkHandle:hover,
        #jkHandle:focus-visible{
            opacity:1;
            width:40px;
            outline:none;
            box-shadow:10px 0 30px -8px rgba(0,0,0,.9), 0 0 26px -6px rgba(44,206,191,.45);
        }
        body.jk-nav-open #jkHandle{
            transform:translateY(-50%) translateX(-120%);
            opacity:0;
            pointer-events:none;
        }
        #jkHandle .jk-handle-mark{
            font-family:'Chakra Petch',sans-serif;
            font-weight:700;
            font-size:13px;
            letter-spacing:.22em;
            writing-mode:vertical-rl;
            text-orientation:mixed;
            color:var(--jk-accent);
            text-shadow:0 0 12px rgba(44,206,191,.55);
        }
        #jkHandle .jk-handle-grip{
            width:2px;height:30px;border-radius:2px;
            background:linear-gradient(180deg,transparent,var(--jk-accent),transparent);
            opacity:.7;
        }
        #jkHandle .jk-handle-chev{font-size:10px;opacity:.85;}
        #jkHandle::after{
            content:"";
            position:absolute;
            inset:-1px -1px -1px -1px;
            border-radius:0 16px 16px 0;
            border:1px solid var(--jk-accent);
            opacity:0;
            animation:jkPulse 2.8s ease-out infinite;
            pointer-events:none;
        }
        @keyframes jkPulse{
            0%{opacity:.55;transform:scale(1);}
            70%{opacity:0;transform:scale(1.22);}
            100%{opacity:0;transform:scale(1.22);}
        }

        /* ---------- Panel lateral ---------- */
        #jkNav{
            position:fixed;
            top:0;
            left:0;
            z-index:9998;
            width:var(--jk-nav-w);
            max-width:86vw;
            height:100%;
            display:flex;
            flex-direction:column;
            padding:22px 18px 18px;
            color:var(--jk-text);
            background:linear-gradient(180deg,#0c262b 0%, #081a1e 45%, var(--jk-deep) 100%);
            border-right:1px solid var(--jk-accent-line);
            box-shadow:34px 0 70px -26px rgba(0,0,0,.95);
            transform:translateX(-102%);
            visibility:hidden;
            transition:transform .48s var(--jk-ease), visibility .48s;
            overflow:hidden;
        }
        body.jk-nav-open #jkNav{transform:translateX(0);visibility:visible;}

        /* retícula ambiental */
        #jkNav::before{
            content:"";
            position:absolute;
            inset:0;
            background-image:
                linear-gradient(rgba(44,206,191,.055) 1px, transparent 1px),
                linear-gradient(90deg, rgba(44,206,191,.055) 1px, transparent 1px);
            background-size:34px 34px;
            -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
            mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
            pointer-events:none;
        }
        /* hilo de luz animado en el borde */
        #jkNav::after{
            content:"";
            position:absolute;
            top:0;
            right:0;
            width:1px;
            height:38%;
            background:linear-gradient(180deg,transparent,var(--jk-accent),transparent);
            animation:jkSlide 5.5s ease-in-out infinite;
            pointer-events:none;
        }
        @keyframes jkSlide{
            0%{transform:translateY(-40%);opacity:0;}
            20%{opacity:1;}
            80%{opacity:1;}
            100%{transform:translateY(260%);opacity:0;}
        }

        .jk-head{
            position:relative;
            display:flex;
            align-items:center;
            gap:12px;
            padding-bottom:18px;
            margin-bottom:16px;
            border-bottom:1px solid rgba(44,206,191,.14);
        }
        .jk-badge{
            flex:0 0 auto;
            width:44px;height:44px;
            display:grid;place-items:center;
            border-radius:12px;
            font-family:'Chakra Petch',sans-serif;
            font-weight:700;
            font-size:17px;
            letter-spacing:.06em;
            color:var(--jk-accent);
            background:linear-gradient(150deg, rgba(44,206,191,.22), rgba(44,206,191,.04));
            border:1px solid var(--jk-accent-line);
            box-shadow:0 0 22px -6px rgba(44,206,191,.7), inset 0 0 14px rgba(44,206,191,.12);
        }
        .jk-head-txt p{margin:0;}
        .jk-head-title{
            font-family:'Chakra Petch',sans-serif;
            font-size:16px;
            font-weight:700;
            letter-spacing:.16em;
            line-height:1.1;
        }
        .jk-head-sub{
            margin-top:4px !important;
            font-family:'Manrope',sans-serif;
            font-size:11px;
            letter-spacing:.24em;
            text-transform:uppercase;
            color:var(--jk-muted);
        }
        #jkClose{
            position:absolute;
            top:0;right:0;
            width:32px;height:32px;
            border-radius:9px;
            border:1px solid rgba(44,206,191,.2);
            background:rgba(44,206,191,.06);
            color:var(--jk-accent);
            cursor:pointer;
            display:grid;place-items:center;
            transition:.25s ease;
        }
        #jkClose:hover{background:rgba(44,206,191,.18);transform:rotate(90deg);}

        .jk-label{
            font-family:'Manrope',sans-serif;
            font-size:10px;
            letter-spacing:.3em;
            text-transform:uppercase;
            color:var(--jk-muted);
            margin:0 0 10px 4px;
        }

        .jk-list{
            list-style:none;
            margin:0;padding:0;
            display:flex;
            flex-direction:column;
            gap:10px;
            position:relative;
        }
        .jk-item{
            opacity:0;
            transform:translateX(-16px);
            transition:opacity .4s ease, transform .4s var(--jk-ease);
        }
        body.jk-nav-open .jk-item{opacity:1;transform:translateX(0);}
        body.jk-nav-open .jk-item:nth-child(1){transition-delay:.08s;}
        body.jk-nav-open .jk-item:nth-child(2){transition-delay:.14s;}
        body.jk-nav-open .jk-item:nth-child(3){transition-delay:.20s;}
        body.jk-nav-open .jk-item:nth-child(4){transition-delay:.26s;}

        .jk-link{
            position:relative;
            width:100%;
            display:flex;
            align-items:center;
            gap:13px;
            padding:11px 12px;
            border-radius:13px;
            cursor:pointer;
            text-align:left;
            color:var(--jk-text);
            background:linear-gradient(90deg, rgba(44,206,191,.05), rgba(255,255,255,.01));
            border:1px solid rgba(44,206,191,.12);
            font-family:'Manrope',sans-serif;
            overflow:hidden;
            transition:transform .25s var(--jk-ease), border-color .25s ease, background .25s ease, box-shadow .25s ease;
        }
        .jk-link::before{
            content:"";
            position:absolute;
            left:0;top:0;bottom:0;
            width:3px;
            background:var(--jk-accent);
            transform:scaleY(0);
            transform-origin:center;
            transition:transform .3s var(--jk-ease);
            box-shadow:0 0 14px rgba(44,206,191,.9);
        }
        .jk-link:hover{
            transform:translateX(4px);
            border-color:rgba(44,206,191,.42);
            background:linear-gradient(90deg, rgba(44,206,191,.16), rgba(44,206,191,.03));
            box-shadow:0 10px 26px -14px rgba(0,0,0,.9), inset 0 0 20px -12px rgba(44,206,191,.7);
        }
        .jk-link:hover::before{transform:scaleY(1);}
        .jk-link:active{transform:translateX(4px) scale(.985);}

        .jk-ico{
            flex:0 0 auto;
            width:42px;height:42px;
            border-radius:11px;
            display:grid;place-items:center;
            font-size:17px;
            color:var(--jk-accent);
            background:rgba(44,206,191,.08);
            border:1px solid rgba(44,206,191,.26);
            transition:.3s var(--jk-ease);
        }
        .jk-link:hover .jk-ico{
            background:rgba(44,206,191,.2);
            box-shadow:0 0 20px -4px rgba(44,206,191,.8);
            transform:translateY(-1px) scale(1.06);
        }
        .jk-txt{flex:1 1 auto;min-width:0;}
        .jk-name{
            display:block;
            font-family:'Chakra Petch',sans-serif;
            font-size:15px;
            font-weight:600;
            letter-spacing:.08em;
            text-transform:uppercase;
        }
        .jk-desc{
            display:block;
            margin-top:2px;
            font-size:11px;
            color:var(--jk-muted);
            letter-spacing:.02em;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .jk-arrow{
            flex:0 0 auto;
            font-size:11px;
            color:var(--jk-accent);
            opacity:0;
            transform:translateX(-6px);
            transition:.28s var(--jk-ease);
        }
        .jk-link:hover .jk-arrow{opacity:1;transform:translateX(0);}

        /* módulo activo */
        .jk-link.jk-active{
            border-color:rgba(44,206,191,.5);
            background:linear-gradient(90deg, rgba(44,206,191,.2), rgba(44,206,191,.04));
        }
        .jk-link.jk-active::before{transform:scaleY(1);}
        .jk-link.jk-active .jk-ico{
            background:var(--jk-accent);
            color:#04211f;
            box-shadow:0 0 22px -4px rgba(44,206,191,.9);
        }
        .jk-link.jk-active .jk-name{color:#fff;}

        .jk-foot{
            margin-top:auto;
            padding-top:16px;
            border-top:1px solid rgba(44,206,191,.12);
            display:flex;
            align-items:center;
            gap:9px;
            font-family:'Manrope',sans-serif;
            font-size:11px;
            letter-spacing:.06em;
            color:var(--jk-muted);
        }
        .jk-dot{
            width:7px;height:7px;border-radius:50%;
            background:var(--jk-accent);
            box-shadow:0 0 0 0 rgba(44,206,191,.7);
            animation:jkDot 2s ease-out infinite;
        }
        @keyframes jkDot{
            0%{box-shadow:0 0 0 0 rgba(44,206,191,.55);}
            100%{box-shadow:0 0 0 9px rgba(44,206,191,0);}
        }
        .jk-hint{
            margin-left:auto;
            font-size:10px;
            letter-spacing:.16em;
            text-transform:uppercase;
            color:rgba(123,156,153,.75);
        }
        kbd{
            font-family:'Chakra Petch',sans-serif;
            font-size:10px;
            padding:2px 5px;
            border-radius:5px;
            color:var(--jk-accent);
            border:1px solid rgba(44,206,191,.3);
            background:rgba(44,206,191,.07);
        }

        /* ---------- Barra de carga al cambiar de módulo ---------- */
        #jkLoader{
            position:fixed;
            top:0;left:0;
            width:100%;height:2px;
            z-index:9999;
            opacity:0;
            transition:opacity .3s ease;
            background:rgba(44,206,191,.12);
            overflow:hidden;
            pointer-events:none;
        }
        #jkLoader.is-on{opacity:1;}
        #jkLoader span{
            display:block;
            width:34%;height:100%;
            background:linear-gradient(90deg,transparent,var(--jk-accent),transparent);
            animation:jkBar 1.1s ease-in-out infinite;
        }
        @keyframes jkBar{
            0%{transform:translateX(-110%);}
            100%{transform:translateX(320%);}
        }

        @media (max-width:420px){
            :root{--jk-nav-w:250px;}
            #jkHandle{height:118px;}
        }
        @media (prefers-reduced-motion:reduce){
            #jkNav::after,#jkHandle::after,.jk-dot{animation:none;}
        }
    </style>
</head>

<body>

    <!-- =========================================
         SISTEMA JK
         CARGA DIRECTAMENTE SIN PIN
    ========================================== -->

    <iframe
        id="appFrame"
        src="https://whitecarappcelphone-sys.github.io/SISTEMAJKOPERACIONES/"
        frameborder="0"
        allowfullscreen
        title="Sistema JK"
    ></iframe>

    <!-- =========================================
         MENÚ DE NAVEGACIÓN OCULTO — SISTEMA JK
         Se activa con la pestaña lateral, con ESC
         o deslizando desde el borde izquierdo.
    ========================================== -->

    <div id="jkLoader"><span></span></div>

    <div id="jkScrim" aria-hidden="true"></div>

    <button id="jkHandle" type="button" aria-label="Abrir menú del Sistema JK" aria-expanded="false" aria-controls="jkNav">
        <span class="jk-handle-chev"><i class="fa-solid fa-chevron-right"></i></span>
        <span class="jk-handle-mark">JK · MENÚ</span>
        <span class="jk-handle-grip"></span>
    </button>

    <nav id="jkNav" aria-label="Módulos del Sistema JK">
        <div class="jk-head">
            <div class="jk-badge">JK</div>
            <div class="jk-head-txt">
                <p class="jk-head-title">SISTEMA JK</p>
                <p class="jk-head-sub">Selector de módulos</p>
            </div>
            <button id="jkClose" type="button" aria-label="Cerrar menú">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <p class="jk-label">Módulos disponibles</p>

        <ul class="jk-list" id="jkList">
            <li class="jk-item">
                <button class="jk-link jk-active" type="button"
                        data-url="https://whitecarappcelphone-sys.github.io/SISTEMAJKOPERACIONES/">
                    <span class="jk-ico"><i class="fa-solid fa-gears"></i></span>
                    <span class="jk-txt">
                        <span class="jk-name">Operaciones</span>
                        <span class="jk-desc">Flujo operativo diario</span>
                    </span>
                    <span class="jk-arrow"><i class="fa-solid fa-arrow-right-long"></i></span>
                </button>
            </li>
            <li class="jk-item">
                <button class="jk-link" type="button"
                        data-url="https://whitecarappcelphone-sys.github.io/SISTEMAJKTALLER/">
                    <span class="jk-ico"><i class="fa-solid fa-screwdriver-wrench"></i></span>
                    <span class="jk-txt">
                        <span class="jk-name">Taller</span>
                        <span class="jk-desc">Servicio y reparaciones</span>
                    </span>
                    <span class="jk-arrow"><i class="fa-solid fa-arrow-right-long"></i></span>
                </button>
            </li>
            <li class="jk-item">
                <button class="jk-link" type="button"
                        data-url="https://whitecarappcelphone-sys.github.io/SISTEMAJKINVENTARIO/">
                    <span class="jk-ico"><i class="fa-solid fa-boxes-stacked"></i></span>
                    <span class="jk-txt">
                        <span class="jk-name">Inventario</span>
                        <span class="jk-desc">Existencias y stock</span>
                    </span>
                    <span class="jk-arrow"><i class="fa-solid fa-arrow-right-long"></i></span>
                </button>
            </li>
            <li class="jk-item">
                <button class="jk-link" type="button"
                        data-url="https://whitecarappcelphone-sys.github.io/SISTEMA-JK/">
                    <span class="jk-ico"><i class="fa-solid fa-user-shield"></i></span>
                    <span class="jk-txt">
                        <span class="jk-name">Administrador</span>
                        <span class="jk-desc">Control y permisos</span>
                    </span>
                    <span class="jk-arrow"><i class="fa-solid fa-arrow-right-long"></i></span>
                </button>
            </li>
        </ul>

        <div class="jk-foot">
            <span class="jk-dot"></span>
            <span>Sesión activa</span>
            <span class="jk-hint"><kbd>Esc</kbd> cerrar</span>
        </div>
    </nav>

    <script id="jkNavScript">
        (function () {
            var frame    = document.getElementById('appFrame');
            var handle   = document.getElementById('jkHandle');
            var nav      = document.getElementById('jkNav');
            var scrim    = document.getElementById('jkScrim');
            var closeBtn = document.getElementById('jkClose');
            var loader   = document.getElementById('jkLoader');
            var links    = Array.prototype.slice.call(document.querySelectorAll('#jkList .jk-link'));

            function openNav() {
                document.body.classList.add('jk-nav-open');
                handle.setAttribute('aria-expanded', 'true');
            }

            function closeNav() {
                document.body.classList.remove('jk-nav-open');
                handle.setAttribute('aria-expanded', 'false');
            }

            function isActive(link) {
                return link.classList.contains('jk-active');
            }

            function go(link) {
                var url = link.getAttribute('data-url');

                links.forEach(function (l) { l.classList.remove('jk-active'); });
                link.classList.add('jk-active');

                if (frame.getAttribute('src') !== url) {
                    loader.classList.add('is-on');
                    frame.setAttribute('src', url);
                }

                closeNav();
            }

            handle.addEventListener('click', function () {
                document.body.classList.contains('jk-nav-open') ? closeNav() : openNav();
            });

            closeBtn.addEventListener('click', closeNav);
            scrim.addEventListener('click', closeNav);

            links.forEach(function (link) {
                link.addEventListener('click', function () {
                    if (isActive(link)) { closeNav(); return; }
                    go(link);
                });
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') { closeNav(); }
                if (e.altKey && (e.key === 'm' || e.key === 'M')) {
                    e.preventDefault();
                    document.body.classList.contains('jk-nav-open') ? closeNav() : openNav();
                }
            });

            /* Deslizar desde el borde izquierdo abre el menú */
            var startX = null;
            document.addEventListener('touchstart', function (e) {
                var t = e.touches[0];
                startX = (t.clientX < 26) ? t.clientX : null;
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
                if (startX === null) { return; }
                if (e.touches[0].clientX - startX > 42) {
                    openNav();
                    startX = null;
                }
            }, { passive: true });

            document.addEventListener('touchend', function () { startX = null; }, { passive: true });

            /* La barra de carga desaparece al terminar de cargar el módulo */
            frame.addEventListener('load', function () {
                loader.classList.remove('is-on');
            });
        })();
    </script>

</body>
</html>
